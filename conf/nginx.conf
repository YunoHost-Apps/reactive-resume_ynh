location / {

  proxy_pass http://127.0.0.1:__PORT__;

  # Standard YunoHost proxy headers. The "no_auth" variant strips any SSO
  # identity headers, since Reactive Resume handles authentication itself.
  include proxy_params_no_auth;

  # Keep AI assistant replies and other streamed responses unbuffered
  proxy_buffering off;
  proxy_read_timeout 300s;

  # Profile pictures and resume imports (PDF, DOCX, JSON)
  client_max_body_size 50M;
}
